name: Replay Trivy Scans on Last 50 Commits (Full + Incremental)

on:
  push:
      branches:
        - replay-latest-50
  workflow_dispatch:

jobs:
  replay-trivy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sha:
          - 273936d5c05acaf72a18e88b333e513ec454aad3
